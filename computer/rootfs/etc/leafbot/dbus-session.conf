<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The session bus of one desktop. It listens on a socket file in the session's own runtime
     folder; the default (an abstract socket) would be reachable from every other desktop, since
     they all share one network namespace and run as the same user. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:dir=/run/xdg</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
