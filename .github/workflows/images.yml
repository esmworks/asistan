name: Images

# Publishes the server and computer images of a version tag to the GitHub Container Registry, so a
# server set up with docker/install.sh pulls them in a minute instead of building them for 10-20
# minutes, which also fails on small servers with too little memory. Each architecture is built on
# its own runner (amd64 and arm64, as cheap ARM servers are common) and the two are then joined
# under one tag: the version without the v, and latest for a release that is not a pre-release.
#
# After the first run, check under the repository's Packages that leafbot-server and
# leafbot-computer are public; servers pull them without signing in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v0.3.0
        required: true

# Each job gets only the permissions it needs. Third-party actions are pinned to a commit, with the
# release it is in next to it, so a moved tag cannot change what runs here.
permissions: {}

concurrency:
  group: images-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [server, computer]
        arch: [amd64, arm64]
        include:
          - image: server
            dockerfile: Dockerfile
          - image: computer
            dockerfile: computer/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          # The image build runs the project's install scripts; the token is not stored in the checkout.
          persist-credentials: false
      - name: Image name
        # Registry names must be lower case; the owner's name may not be.
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "IMAGE=ghcr.io/$owner/leafbot-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        image: [server, computer]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the architectures under the version tags
        working-directory: digests
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image=ghcr.io/$owner/leafbot-${{ matrix.image }}
          tags=(-t "$image:${TAG#v}")
          # A pre-release (v1.2.0-beta.1) does not become what new installations get.
          [[ $TAG == *-* ]] || tags+=(-t "$image:latest")
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:${TAG#v}"
