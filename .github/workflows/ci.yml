name: CI

# Automatic runs are off for now; run it by hand from the Actions tab.
# To turn them back on, add the push (branches: [main]) and pull_request triggers here again.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm sürümü package.json'daki packageManager alanından okunur.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Derleme testlerden önce: masaüstü testleri derlenmiş sunucuyu başlatır.
      - run: pnpm build
      - run: pnpm test
