# Packaging settings. The server and app are built first (pnpm build at the root).
appId: com.esmworks.yumakbot
# The name people read: the app bundle, the menu bar title (macOS takes it from the bundle, not
# from the menu), the Windows exe and shortcuts. Installer and update file names keep "YumakBot"
# below: a space in a release asset's name does not survive the upload, and the update information
# must name the file as it was uploaded.
productName: Yumak Bot
copyright: Copyright (C) 2026 esmworks (Erhan Erbaş)
directories:
  output: out
# Where releases live. The release workflow uploads the installers itself (--publish never), along
# with the update information electron-builder writes for this target (latest*.yml, *.blockmap):
# an installed app reads it from the latest published release to update itself.
publish:
  provider: github
  owner: esmworks
  repo: yumakbot
files:
  - dist/**
  - package.json
# The server (bundle plus production node_modules, from `pnpm stage`) is copied by
# after-pack.cjs: extraResources would leave node_modules out.
afterPack: ./after-pack.cjs
extraResources:
  - from: ../app/dist
    to: app
  - from: assets
    to: assets
mac:
  # An Icon Composer icon: a gradient tile and the plush as its own layer, so macOS draws the light
  # rim of glass round it as on its own icons. electron-builder compiles it with Xcode 26's actool
  # and makes the .icns earlier macOS versions read from it.
  icon: assets/icon.icon
  category: public.app-category.productivity
  target:
    - dmg
    # The zip is what an installed app downloads to update itself; macOS cannot update from a dmg.
    - zip
  artifactName: YumakBot-${version}-${arch}-mac.${ext}
  extendInfo:
    LSUIElement: false
  # Signed with the Developer ID in the keychain, or the one in CSC_LINK / CSC_KEY_PASSWORD on CI,
  # and sent to Apple for notarization when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID
  # are set, so the downloaded app opens without the "unidentified developer" warning. Without
  # them the build still succeeds, unsigned or not notarized.
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
win:
  icon: assets/icon.png
  target: nsis
nsis:
  # A per-user install needs no administrator rights; the user still picks the folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: YumakBot-${version}-Setup.${ext}
dmg:
  artifactName: YumakBot-${version}-${arch}.${ext}
  # The stock background is 380 high with the icons at y 220, which leaves an empty band above
  # them. This one is shorter and puts the icons and the arrow in the middle of what Finder shows
  # (the window's height includes its title bar, so about 30 at the bottom of the image is hidden).
  # The window takes the image's size; background@2x.png next to it is used on Retina screens.
  # The PNGs are drawn from background.svg:
  #   rsvg-convert -w 540 -h 280 dmg/background.svg -o dmg/background.png
  #   rsvg-convert -w 1080 -h 560 dmg/background.svg -o dmg/background@2x.png
  background: dmg/background.png
  contents:
    - x: 130
      y: 110
      type: file
    - x: 410
      y: 110
      type: link
      path: /Applications
