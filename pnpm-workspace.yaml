packages:
  - shared
  - server
  - app
  - desktop
  - computer
  - mobile
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  '@google/genai': false
  protobufjs: false
  '@whiskeysockets/baileys': false
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.6'
  - electron@45.3.1
  - framer-motion@14.13.0
  - motion-dom@14.13.0
  - motion@14.13.0
  - prettier@3.10.1
patchedDependencies:
  '@norbert_bodziony/bloub@0.6.4': patches/@norbert_bodziony__bloub@0.6.4.patch
# Dependencies of dependencies moved past versions with published advisories, until the packages that
# pull them in ask for fixed versions themselves:
#   katex (rehype-katex, remark-math): prototype pollution could bypass the `trust` option. The app
#     already uses 0.19 directly, so formulas are drawn by the version whose styles the page loads.
#   esbuild (drizzle-kit, a development tool): its development server answered any website.
#   minimatch 7 to 11.0.0 (eslint and electron-builder tools): denial of service through a pattern.
overrides:
  'katex@<0.18.2': 0.19.1
  'esbuild@<0.24.3': 0.25.12
  'minimatch@>=7.0.0 <11.0.1': 11.0.8
